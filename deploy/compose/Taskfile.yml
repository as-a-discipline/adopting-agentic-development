version: "3"

vars:
  COMPOSE_FILE: "{{.TASKFILE_DIR}}/docker-compose.yml"

tasks:
  up:
    desc: Start the Compose integration environment
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" up -d --build --wait

  down:
    desc: Stop the Compose integration environment
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" down --volumes --remove-orphans

  logs:
    desc: Show logs from the Compose integration environment
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" logs

  test:
    desc: Run deterministic integration tests against the Compose stack
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - defer: { task: down }
      - task: up
      - "{{.TASKFILE_DIR}}/test.sh"

  validate:
    desc: Validate the Compose integration environment
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: test
