version: "3"

vars:
  REDOCLY_IMAGE: redocly/cli:1.25.3
  OASDIFF_IMAGE: tufin/oasdiff:v1.31.0
  OPENAPI_CHANGES_IMAGE: pb33f/openapi-changes:v0.2.11
  GO_IMAGE: golang:1.23-alpine
  OAPI_CODEGEN_VERSION: v2.4.1

tasks:
  lint:
    desc: Lint the OpenAPI contract (Redocly CLI, pinned container)
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - docker run --rm -v "{{.TASKFILE_DIR}}":/spec -w /spec {{.REDOCLY_IMAGE}} lint openapi.yaml

  compat:
    desc: Check the contract for breaking changes against the stored baseline (oasdiff, pinned container)
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - |
        if [ ! -f openapi.baseline.yaml ]; then
          echo "No compatibility baseline found — bootstrapping openapi.baseline.yaml from the current contract."
          echo "This run establishes the baseline; it does not itself prove compatibility."
          cp openapi.yaml openapi.baseline.yaml
        else
          docker run --rm -v "{{.TASKFILE_DIR}}":/spec -w /spec {{.OASDIFF_IMAGE}} breaking --fail-on ERR /spec/openapi.baseline.yaml /spec/openapi.yaml
        fi

  breaking-changes:
    desc: >-
      Detect breaking changes between the current working tree and the
      current branch's last pushed commit (or the target mainline branch if
      nothing has been pushed yet). TOOL=oasdiff (default) or
      TOOL=openapi-changes; pass an explicit ref as CLI_ARGS, e.g.
      `task api:breaking-changes -- main`.
    dir: "{{.TASKFILE_DIR}}/.."
    vars:
      TOOL: '{{.TOOL | default "oasdiff"}}'
    cmds:
      - >-
        TOOL="{{.TOOL}}"
        OASDIFF_IMAGE="{{.OASDIFF_IMAGE}}"
        OPENAPI_CHANGES_IMAGE="{{.OPENAPI_CHANGES_IMAGE}}"
        ./scripts/check-api-breaking-changes.sh {{.CLI_ARGS}}

  generate:
    desc: Regenerate downstream Go server types/interfaces from the OpenAPI contract
    deps: [lint]
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - mkdir -p "{{.TASKFILE_DIR}}/../service/generated"
      - >
        docker run --rm
        -v "{{.TASKFILE_DIR}}/..":/src -w /src/api
        {{.GO_IMAGE}}
        sh -c "go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} -generate types,std-http,spec -package generated openapi.yaml > ../service/generated/api.gen.go.tmp && mv ../service/generated/api.gen.go.tmp ../service/generated/api.gen.go"

  validate:
    desc: Validate the API contract (lint + compatibility + generation freshness)
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: lint
      - task: compat
      - task: generate
      - "{{.TASKFILE_DIR}}/../scripts/check-generated-fresh.sh service/generated {{.TASKFILE_DIR}}/.."

