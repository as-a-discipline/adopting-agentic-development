server {
    # 8080 (not 80): the runtime image (nginxinc/nginx-unprivileged) runs as a
    # non-root user, which cannot bind privileged ports below 1024. See
    # policies/README.md rule 5 (container/deployment quality).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy same-origin API calls to the pulse-service container. This
    # lets the web app use its default same-origin "/api/v1" base URL
    # unchanged (see src/main.ts) with no CORS configuration needed, and keeps
    # the pulse-service hostname/port as an internal Compose network detail.
    location /api/v1/ {
        proxy_pass http://pulse-service:8080/api/v1/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
